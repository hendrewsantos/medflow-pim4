server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Rotas da SPA (createWebHistory): qualquer caminho devolve o index.html.
  location / { try_files $uri /index.html; }
  # Arquivos com hash no nome: cache longo.
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  # CSP da interface: só o próprio site, Google Fonts e o VLibras (tradução para Libras, gov.br).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://*.gov.br; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://*.gov.br; font-src 'self' data: https://fonts.gstatic.com https://*.gov.br; img-src 'self' data: blob: https://*.gov.br; media-src 'self' https://*.gov.br; connect-src 'self' https://*.gov.br; frame-src https://*.gov.br; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
